    <script type="application/ld+json">[{"@context":"https://schema.org","@type":"WebApplication","name":"ATStra","url":"https://atstra.pages.dev/","applicationCategory":"BusinessApplication","operatingSystem":"Any (web browser)","description":"Score your CV against any job description, see the keywords you are missing and accept evidence-backed edits one at a time. Download an ATS-friendly Word CV.","featureList":["ATS CV score out of 100 from a published rubric","Job description keyword coverage: found and missing terms","Parse check for multi-column layouts, tables and headers","Evidence-backed edit suggestions reviewed one at a time","Five ATS-friendly single-column Word (DOCX) templates","Application and outcome tracking"]},{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is an ATS, and why does it matter for my CV?","acceptedAnswer":{"@type":"Answer","text":"An applicant tracking system (ATS) is the software many employers use to collect and search applications. It reads your CV as plain text. Multi-column layouts, tables and text boxes can scramble that text, and a CV that describes your work in different words from the job posting can be harder to find. ATStra checks both."}},{"@type":"Question","name":"How is the ATStra score calculated?","acceptedAnswer":{"@type":"Answer","text":"The score is out of 100 and is calculated in code from a published rubric: keyword coverage (35), evidence and impact (20), parse safety (20), title and summary fit (15) and hygiene (10). The same CV and job description always give the same score. It measures coverage and parse safety. It does not predict shortlisting."}},{"@type":"Question","name":"Will ATStra make things up on my CV?","acceptedAnswer":{"@type":"Answer","text":"No. Every suggested rewrite must quote evidence that is already in your CV, and suggestions that invent numbers, employers, job titles, degrees or tools are dropped or turned into a question for you. Nothing reaches your exported CV unless it was already there or you typed or confirmed it."}},{"@type":"Question","name":"What file do I get at the end?","acceptedAnswer":{"@type":"Answer","text":"An editable, single-column Word document (DOCX) with real headings and bullet lists, in one of five templates. It works for portal uploads and for emailing recruiters, and you can polish it further in Word or Google Docs."}},{"@type":"Question","name":"Does it work with two-column or designed CVs?","acceptedAnswer":{"@type":"Answer","text":"Yes. Upload the PDF as it is. ATStra reads the columns in the right order, flags the layout in the parse check and exports a single-column version that applicant tracking systems read cleanly."}},{"@type":"Question","name":"Who can sign up?","acceptedAnswer":{"@type":"Answer","text":"Anyone with a Gmail address. Sign in with Google and your account is created on the spot. Each account sees only its own CVs and applications. You can run up to 30 job analyses a day."}},{"@type":"Question","name":"What happens to my data?","acceptedAnswer":{"@type":"Answer","text":"Your files are kept in private storage and only you can open them. Contact details are removed before the job analysis runs, there are no analytics or ad trackers, and deleting a CV or application deletes its files."}}]}]</script>
